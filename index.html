<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Brandon Miller's Coral Inventory</title>
<style>
:root{--bg1:#f7fbff;--bg2:#eaf6ff;--card:rgba(255,255,255,.92);--card2:rgba(255,255,255,.97);--stroke:rgba(15,23,42,.12);--text:rgba(15,23,42,.92);--muted:rgba(15,23,42,.68);--good:rgba(22,163,74,.85);--warn:rgba(245,158,11,.85);--bad:rgba(239,68,68,.85)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.wrap{max-width:1200px;margin:0 auto;padding:28px 16px 96px}
.top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}

.top{
  position:sticky; top:0; z-index:50;
  padding:14px 12px; margin: -8px -12px 10px;
  border-radius:18px;
  background:rgba(8,12,24,.72);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.top h1{font-size:28px;line-height:1.05}
.sub{font-size:13px}
.cta .btn{border-radius:999px;padding:10px 12px}
.cta .btn.primary{background:rgba(84,180,255,.18);border-color:rgba(84,180,255,.35)}
.cta .btn.primary:hover{transform:translateY(-1px)}

/* TSA-ish product card feel */
.item{border-radius:22px}
.item:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(0,0,0,.28)}
.thumb{border-radius:18px}
.name{font-weight:950;letter-spacing:.1px}
.metaRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:950;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.badge.wys{border-color:rgba(255,210,140,.35);background:rgba(255,210,140,.10)}
.badge.priced{border-color:rgba(140,255,196,.35);background:rgba(140,255,196,.10)}

/* Make filters feel like a shop toolbar */
.controls{gap:10px;grid-template-columns:1.8fr 1fr 1fr 1.1fr 1fr 1fr}
input[type="text"], select{
  width:100%;padding:12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:var(--text);outline:none;
}
input[type="text"]::placeholder{color:rgba(255,255,255,.55)}

/* Mobile: keep CTA visible and make controls swipeable */
@media (max-width:720px){
  .wrap{padding:14px 12px 110px}
  .top{margin: -4px -6px 10px; padding:12px 10px}
  .controls{display:flex;gap:10px;overflow:auto;padding-bottom:2px;scroll-snap-type:x mandatory}
  .controls > div{min-width:190px;scroll-snap-align:start}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){ .grid{grid-template-columns:1fr} }

h1{margin:0;font-size:40px;letter-spacing:.2px}
.sub{margin-top:6px;color:var(--muted)}
.cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:16px;background:var(--card2);border:1px solid var(--stroke);color:rgba(15,23,42,.92);text-decoration:none;font-weight:900;cursor:pointer}
.notice{margin:16px 0;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--muted)}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.92);font-weight:950}
.infoRow{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:12px;backdrop-filter:blur(8px)}
.controls{display:grid;gap:12px;grid-template-columns:1.4fr 1fr 1fr 1.2fr 1fr 1fr;margin:12px 0}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:900;letter-spacing:.2px}
input,select{width:100%;padding:12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.10);color:var(--text);outline:none}
.checks{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:4px}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:900}
.sectionTitle{margin:18px 0 10px;font-weight:950;font-size:18px;letter-spacing:.2px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(7,1fr);margin:12px 0 16px}
.stat .k{font-size:12px;color:var(--muted);font-weight:900}
.stat .v{font-size:22px;font-weight:950;margin-top:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.item{background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{height:220px;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.70);cursor:pointer}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:12px 12px 14px}
.row1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.name{font-weight:950;font-size:18px;line-height:1.2}
.cat{font-size:12px;color:var(--muted);margin-top:3px;font-weight:900}
.size{margin-top:6px;font-size:12px;color:rgba(255,255,255,.78);font-weight:900}
.pill{font-size:11px;font-weight:950;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);white-space:nowrap}
.p-available{color:var(--good)}.p-pending{color:var(--warn)}.p-growing{color:rgba(160,200,255,.90)}.p-sold{color:var(--bad)}
.notes{margin-top:10px;color:rgba(255,255,255,.78);font-size:13px;white-space:pre-wrap;min-height:18px}
.priceLine{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:950}
.small{font-size:12px;color:var(--muted)}
.add{width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);color:var(--text);font-weight:950;cursor:pointer}
.add:hover{background:rgba(0,0,0,.24)}
.btnRow{display:flex;gap:10px;margin-top:10px}
.btnSmall{flex:1; padding:10px 10px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.18); color:var(--text); font-weight:950; cursor:pointer}
.btnSmall:hover{background:rgba(0,0,0,.24)}
.modalBack{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.52);padding:18px;z-index:80}
.modal{width:min(900px,96vw);border-radius:22px;overflow:hidden;background:rgba(12,16,22,.92);border:1px solid rgba(255,255,255,.14)}
.mHead{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;gap:10px;align-items:center}
.mTitle{font-weight:950;font-size:18px}
.mBody{padding:14px 16px;color:rgba(255,255,255,.84)}
.mFoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.10);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.mBtn{padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);font-weight:950;cursor:pointer}
/* Floating Cart badge */
.fab{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.badge{min-width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:950;background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.14)}
.fabBtn{all:unset;cursor:pointer;font-weight:950}
@media (max-width:900px){h1{font-size:34px}.controls{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.infoRow{grid-template-columns:1fr}}

/* Mobile-first storefront upgrades */
body{
  background: linear-gradient(180deg,var(--bg1),var(--bg2));
  background-image: linear-gradient(180deg,var(--bg1),var(--bg2)), var(--bg-url, none);
  background-size: cover, cover;
  background-position: center, center;
  background-attachment: fixed, fixed;
}
.topTools{margin-top:10px; display:flex; flex-direction:column; gap:10px; max-width:720px}
#qTop{
  width:100%;
  padding:12px 12px;
  border-radius:14px;

  background:rgba(0,0,0,.22);
  color:var(--text);
  outline:none;
  font-weight:700;
}
#qTop::placeholder{color:rgba(255,255,255,.55)}
.chips{display:flex; gap:8px; overflow:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch}
.chip{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.8);
  color:rgba(15,23,42,.86);
  padding:8px 10px;
  border-radius:999px;
  font-weight:850;
  font-size:12px;
  letter-spacing:.2px;
  cursor:pointer;
  user-select:none;
}
.chip.active{border-color:rgba(14,165,233,.35);background:rgba(14,165,233,.18)}
@media (min-width: 760px){ .topTools{flex-direction:row; align-items:center} #qTop{max-width:360px} }
/* Bright & clean overrides */
input,select,textarea{ background: rgba(255,255,255,.92); color: rgba(15,23,42,.92); border: 1px solid rgba(15,23,42,.14); }

.btn.primary{background: rgba(14,165,233,.18); border-color: rgba(14,165,233,.35)}

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Brandon Miller's Coral Inventory Page</h1>
      <div class="sub">Browse corals and text to buy.</div>
      <div class="topTools">
        <input id="qTop" type="text" placeholder="Search corals..." autocomplete="off"/>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="cta">
      <a class="btn primary" id="textLink" href="#">Text to Buy</a>
      <a class="btn" id="messengerLink" href="#" target="_blank" rel="noopener">Messenger</a>
      <a class="btn" id="callLink" href="#">Call</a>
    </div>
  </div>

  <div class="banner">Local pickup only. No shipping at this time.</div>

  <div class="controls">
    <div class="card"><label for="q">Search</label><input id="q" type="text" placeholder="Search..."/></div>
    <div class="card"><label for="cat">Category</label><select id="cat"></select></div>
    <div class="card"><label for="st">Status</label>
      <select id="st"><option value="all">All</option><option value="available">Available</option><option value="pending">Pending</option><option value="growing">Still Growing</option><option value="sold">Sold</option></select>
    </div>
    <div class="card"><label>Filters</label>
      <div class="checks">
        <div class="ck"><input id="fFeat" type="checkbox"/> <span>Featured</span></div>
        <div class="ck"><input id="fNew" type="checkbox"/> <span>New</span></div>
        <div class="ck"><input id="showSold" type="checkbox"/> <span>Show sold</span></div>
        <div class="ck"><input id="hideNoPrice" type="checkbox"/> <span>Hide no price</span></div>
      </div>
    </div>
    <div class="card"><label for="sort">Sort</label>
      <select id="sort">
        <option value="featured">Featured first</option>
        <option value="new">New first</option>
        <option value="priceLow">Price: low → high</option>
        <option value="priceHigh">Price: high → low</option>
        <option value="name">Name</option>
      </select>
    </div>
    <div class="card"><label>Cart</label><a class="btn" href="javascript:void(0)" id="openCart">Open</a><div class="small" id="cartMini">0 items</div></div>
  </div>

  <div class="stats card" id="stats"></div>

  <div id="featuredSection" style="display:none;">
    <div class="sectionTitle">Featured</div>
    <div class="grid" id="featuredGrid"></div>
  </div>

  <div class="sectionTitle" id="allTitle" style="display:none;">All items</div>
  <div class="grid" id="grid"></div>

  <div class="card" style="margin-top:14px;">
    <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;">
      <div>
        <div style="font-weight:950;">Last updated</div>
        <div style="margin-top:6px; color:rgba(255,255,255,.78);" id="updatedAt"></div>
      </div>
      <div class="small">Tip: Add 3+ items for a bundle discount.</div>
    </div>
  </div>
</div>

<div class="fab" id="fabCart">
  <button class="fabBtn" id="fabOpen">Cart</button>
  <div class="badge" id="fabCount">0</div>
</div>

<div class="modalBack" id="mb">
  <div class="modal">
    <div class="mHead"><div class="mTitle" id="mt">Details</div><button class="mBtn" id="mc">Close</button></div>
    <div class="mBody" id="mcont"></div>
    <div class="mFoot"><button class="mBtn" id="mok">Close</button></div>
  </div>
</div>

const $ = (id)=>document.getElementById(id);
const norm=(s)=>(s||'').toString().trim().toLowerCase();
const itemKey=(c,n)=>c+'|'+n;
const currency=(n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const parsePrice=(s)=>{ if(s==null) return NaN; const t=(''+s).replace(/[^0-9.]/g,''); if(!t) return NaN; return parseFloat(t); };

const isPerLb = (key)=> (key.split('|')[0]||'').toLowerCase() === 'live rock';
const availFor = (key)=>{
  const v = DATA.availLbs && DATA.availLbs[key] !== undefined ? parseFloat(DATA.availLbs[key]) : NaN;
  return (isFinite(v) && v>0) ? v : NaN;
};
const sizeFor = (key)=> (DATA.size && DATA.size[key]) ? (''+DATA.size[key]).trim() : '';

const cartKey='coral_claim_list_v1';
const cart=JSON.parse(localStorage.getItem(cartKey)||'{}');

const getQty = (key)=>{
  const v = cart[key];
  if(v === true) return 1;
  if(v == null) return 0;
  if(typeof v === 'number') return v;
  if(typeof v === 'string'){ const n = parseFloat(v); return isFinite(n) ? n : 1; }
  if(typeof v === 'object' && v.qty != null){ const n = parseFloat(v.qty); return isFinite(n) ? n : 1; }
  return 1;
};
const setQty = (key, qty)=>{
  if(!qty || !isFinite(qty) || qty <= 0){ delete cart[key]; return; }
  const a = availFor(key);
  if(isPerLb(key) && isFinite(a)) qty = Math.min(qty, a);
  cart[key] = qty;
};

function saveCart(){
  localStorage.setItem(cartKey, JSON.stringify(cart));
  const count = Object.keys(cart).length;
  $('cartMini').textContent = count + (count===1?' item':' items');
  $('openCart').textContent = 'Open ('+count+')';
  $('fabCount').textContent = String(count);
}

const statusLabel=(s)=>{
  const v=(s||'available').toLowerCase();
  if(v==='pending') return ['Pending','p-pending'];
  if(v==='growing') return ['Still Growing','p-growing'];
  if(v==='sold') return ['Sold','p-sold'];
  return ['Available','p-available'];
};

function setUpdated(){
  const d = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
  $('updatedAt').textContent = d && !isNaN(d) ? d.toLocaleString() : (DATA.updatedAt||'');
}

function buildCategories(){
  const set={};
  (DATA.items||[]).forEach(x=>set[x.category]=true);
  const cats=Object.keys(set).sort((a,b)=>a.localeCompare(b));
  $('cat').innerHTML = '<option value="all">All categories</option>' + cats.map(c=>`<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join('');
}

function showModal(title, html){ $('mt').textContent=title; $('mcont').innerHTML=html; $('mb').style.display='flex'; }
function hideModal(){ $('mb').style.display='none'; }

function buildSmsHref(msg){ return 'sms:' + PHONE_DIGITS + '?&body=' + encodeURIComponent(msg); }

function textToBuy(extraLine){
  const keys=Object.keys(cart);
  if(!keys.length && !extraLine) return;

  const parts = keys.map(k=>{
    const [c,name]=k.split('|');
    const qty = getQty(k);
    const per = isPerLb(k);
    const raw=(DATA.pricesPlain && DATA.pricesPlain[k]) ? (''+DATA.pricesPlain[k]) : '';
    const priceNum = parsePrice(raw);
    const prettyUnit = (raw && /[0-9]/.test(raw) && isFinite(priceNum)) ? currency(priceNum) : raw;
    if(per){
      return `${name} (${c}) — ${qty} lb${prettyUnit ? ` @ ${prettyUnit}/lb` : ''}`;
    }
    return `${name} (${c})${prettyUnit ? ' — ' + prettyUnit : ''}`;
  });

  let msg = parts.length ? ('Hi Brandon — I want to buy: ' + parts.join(', ') + '. Thanks!') : 'Hi Brandon — I’m interested in a coral pack. Thanks!';
  if(extraLine) msg += '\n\n' + extraLine;

  if(keys.length >= 3){
    msg += '\n\nI have ' + keys.length + ' items — can you apply the bundle discount?';
  } else if(BUNDLE_NOTE){
    msg += '\n\n' + BUNDLE_NOTE;
  }
  if(PICKUP_NOTE) msg += '\n\n' + PICKUP_NOTE;

  window.location.href = buildSmsHref(msg);
}
document.getElementById('textLink').onclick = (e)=>{ e.preventDefault(); textToBuy(); };

function cartTotals(){
  let total = 0;
  for(const k of Object.keys(cart)){
    const qty = getQty(k);
    const per = isPerLb(k);
    const raw = (DATA.pricesPlain && DATA.pricesPlain[k]) ? (''+DATA.pricesPlain[k]) : '';
    const n = parsePrice(raw);
    if(isFinite(n)) total += per ? (n * qty) : n;
  }
  return total;
}

function openCartModal(){
  const keys=Object.keys(cart);
  if(!keys.length){ showModal('Cart','<div>No items yet.</div>'); return; }

  let rows='';
  for(const k of keys){
    const [c,name]=k.split('|');
    const per = isPerLb(k);
    const qty = getQty(k);

    const raw = (DATA.pricesPlain && DATA.pricesPlain[k]) ? (''+DATA.pricesPlain[k]) : '';
    const n = parsePrice(raw);
    const unitPrice = (raw && /[0-9]/.test(raw) && isFinite(n)) ? currency(n) : (raw || 'Text for price');
    const lineTotal = (isFinite(n) ? (per ? (n*qty) : n) : 0);
    const lineTxt = (isFinite(n) ? currency(lineTotal) : '—');

    const a = availFor(k);
    const maxAttr = (per && isFinite(a)) ? ` max="${a}"` : '';
    const availLine = (per && isFinite(a)) ? `<div class="small" style="margin-top:6px;">Available: ${a} lb</div>` : '';

    rows += `<div style="display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.10); align-items:flex-start;">
      <div style="min-width:0;">
        <div style="font-weight:950;">${name}</div>
        <div style="color:rgba(255,255,255,.70); font-size:12px;">${c}${per ? ' • per lb' : ''}</div>
      </div>
      <div style="text-align:right; min-width:260px;">
        ${per ? `<div style="display:flex; gap:8px; justify-content:flex-end; align-items:center;">
          <input class="qty" inputmode="decimal" type="number" step="0.1" min="0.1"${maxAttr} value="${qty}" data-qty="${k.replace(/"/g,'&quot;')}"/>
          <div style="font-weight:900;">lb</div>
        </div>
        <div class="small" style="margin-top:6px;">${unitPrice}${isFinite(n) ? '/lb' : ''}</div>
        ${availLine}`
        : `<div style="font-weight:900;">${unitPrice}</div>`}
        <div style="margin-top:6px; font-weight:950;">${lineTxt}</div>
        <button class="mBtn" style="margin-top:8px;" data-rm="${k.replace(/"/g,'&quot;')}">Remove</button>
      </div>
    </div>`;
  }

  rows += `<div style="display:flex; justify-content:space-between; padding-top:10px;">
    <div style="font-weight:950;">Total</div><div style="font-weight:950;">${currency(cartTotals())}</div></div>
    <div style="margin-top:12px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
      <button class="mBtn" id="clearAll">Clear all</button>
      <button class="mBtn" id="textNow">Text to Buy</button>
    </div>`;

  showModal('Cart', rows);

  document.querySelectorAll('[data-rm]').forEach(b=>{
    b.onclick = ()=>{ delete cart[b.getAttribute('data-rm')]; saveCart(); render(); openCartModal(); };
  });

  document.querySelectorAll('[data-qty]').forEach(inp=>{
    inp.oninput = ()=>{
      const key = inp.getAttribute('data-qty');
      let q = parseFloat(inp.value);
      if(!isFinite(q) || q<=0) q = 0;
      setQty(key, q);
      saveCart();
      render();
      clearTimeout(inp._t);
      inp._t = setTimeout(()=>{ openCartModal(); }, 150);
    };
  });

  $('clearAll').onclick = ()=>{ Object.keys(cart).forEach(k=>delete cart[k]); saveCart(); render(); openCartModal(); };
  $('textNow').onclick = ()=>{ textToBuy(); };
}

function render(){

  const cat=$('cat').value;
  const stf=$('st').value;
  const onlyFeat=$('fFeat').checked;
  const onlyNew=$('fNew').checked;
  const showSold=$('showSold').checked;
  const hideNoPrice=$('hideNoPrice').checked;
  const sortMode=$('sort').value;

  const its=(DATA.items||[]).slice();

  const keyOf = (it)=> itemKey(it.category,it.name);
  const priceOf = (key)=>{
    const raw=(DATA.pricesPlain && DATA.pricesPlain[key]) ? (''+DATA.pricesPlain[key]) : '';
    const n=parsePrice(raw);
    return isFinite(n) ? n : NaN;
  };
  const createdOf = (key)=>{
    const t = DATA.createdAt && DATA.createdAt[key] ? Date.parse(DATA.createdAt[key]) : NaN;
    return isFinite(t) ? t : NaN;
  };

  its.sort((a,b)=>{
    const ka=keyOf(a), kb=keyOf(b);

    if(sortMode==='new'){
      const ta=createdOf(ka), tb=createdOf(kb);
      if(isFinite(ta) || isFinite(tb)){
        return (isFinite(tb)?tb:-1e15) - (isFinite(ta)?ta:-1e15);
      }
    }
    if(sortMode==='priceLow' || sortMode==='priceHigh'){
      const pa=priceOf(ka), pb=priceOf(kb);
      const aHas=isFinite(pa), bHas=isFinite(pb);
      if(aHas && bHas) return (sortMode==='priceLow') ? (pa-pb) : (pb-pa);
      if(aHas!==bHas) return aHas ? -1 : 1;
    }
    if(sortMode==='name'){
      const cn=a.category.localeCompare(b.category); if(cn!==0) return cn;
      return a.name.localeCompare(b.name);
    }

    const fa=!!DATA.featured?.[ka], fb=!!DATA.featured?.[kb];
    if(fa!==fb) return fa?-1:1;
    const na=!!DATA.newTag?.[ka], nb=!!DATA.newTag?.[kb];
    if(na!==nb) return na?-1:1;
    const ca=a.category.localeCompare(b.category); if(ca!==0) return ca;
    return a.name.localeCompare(b.name);
  });

  let shown=0, avail=0, pend=0, grow=0, sold=0;
  const featuredCards=[];
  const cards=[];

  const matches = (it, key)=>{
    const st0=(DATA.status?.[key] || 'available').toLowerCase();
    const isFeat=!!DATA.featured?.[key];
    const isNew=!!DATA.newTag?.[key];
    const raw=(DATA.pricesPlain?.[key] || '').toString().trim();
    const hasPrice = !!raw;

    if(hideNoPrice && !hasPrice) return false;
    if(q && !(norm(it.name).includes(q) || norm(it.category).includes(q))) return false;
    if(cat!=='all' && it.category!==cat) return false;
    if(stf!=='all' && st0!==stf) return false;
    if(!showSold && st0==='sold') return false;
    if(onlyFeat && !isFeat) return false;
    if(onlyNew && !isNew) return false;
    return true;
  };

  const cardHtml = (it)=>{
    const key=itemKey(it.category,it.name);
    const st0=(DATA.status?.[key] || 'available').toLowerCase();
    const isFeat=!!DATA.featured?.[key];
    const isNew=!!DATA.newTag?.[key];
    const per = isPerLb(key);

    const [label,cls]=statusLabel(st0);
    const url=(DATA.photoUrls?.[key] || '').trim();
    const notes=(DATA.notes?.[key] || '').trim();
    const size=sizeFor(key);

    const raw=(DATA.pricesPlain?.[key] || '').toString().trim();
    const n = parsePrice(raw);
    let price = (raw && /[0-9]/.test(raw) && isFinite(n)) ? currency(n) : (raw ? raw : 'Text for price');
    if(per && price && price!=='Text for price') price = price + ' / lb';

    const a = availFor(key);
    const availTag = (per && isFinite(a)) ? ` • avail ${a} lb` : '';

    const qty = getQty(key);
    const sizeLine = size ? `<div class="size">${size}</div>` : '';

    if(per){
      const disabled1 = (isFinite(a) && qty + 1 > a) ? 'disabled' : '';
      const disabled5 = (isFinite(a) && qty + 5 > a) ? 'disabled' : '';
      const disabled10 = (isFinite(a) && qty + 10 > a) ? 'disabled' : '';
      return `
        <div class="item">
          <div class="hero" data-img="${url.replace(/"/g,'&quot;')}" data-name="${it.name.replace(/"/g,'&quot;')}">
            ${url ? `<img src="${url.replace(/"/g,'&quot;')}" alt="photo">` : `<div>📷 No photo</div>`}
          </div>
          <div class="meta">
            <div class="row1">
              <div>
                <div class="name">${it.name}</div>
                <div class="cat">${it.category} • per lb${availTag}</div>
                ${sizeLine}
              </div>
              <div class="pill ${cls}">${label}</div>
            </div>
            <div class="notes">${notes || ''}</div>
            <div class="priceLine">
              <div class="price">${price}</div>
              <div class="small">${isFeat ? 'Featured' : (isNew ? 'New' : '')}</div>
            </div>
            <div class="btnRow">
              <button class="btnSmall" data-addlb="1" data-key="${key.replace(/"/g,'&quot;')}" ${disabled1}>+1</button>
              <button class="btnSmall" data-addlb="5" data-key="${key.replace(/"/g,'&quot;')}" ${disabled5}>+5</button>
              <button class="btnSmall" data-addlb="10" data-key="${key.replace(/"/g,'&quot;')}" ${disabled10}>+10</button>
            </div>
            <div class="small" style="margin-top:10px;">In cart: <b>${qty || 0} lb</b> ${isFinite(a) ? `(max ${a} lb)` : ''}</div>
            <button class="add" data-open="1">Open Cart</button>
          </div>
        </div>`;
    }

    const inCart = cart[key] != null;
    const inTxt = inCart ? 'Added ✔ (click to remove)' : 'Add to Cart';
    return `
      <div class="item">
        <div class="hero" data-img="${url.replace(/"/g,'&quot;')}" data-name="${it.name.replace(/"/g,'&quot;')}">
          ${url ? `<img src="${url.replace(/"/g,'&quot;')}" alt="photo">` : `<div>📷 No photo</div>`}
        </div>
        <div class="meta">
          <div class="row1">
            <div>
              <div class="name">${it.name}</div>
              <div class="cat">${it.category}</div>
              ${sizeLine}
            </div>
            <div class="pill ${cls}">${label}</div>
          </div>
          <div class="notes">${notes || ''}</div>
          <div class="priceLine">
            <div class="price">${price}</div>
            <div class="small">${isFeat ? 'Featured' : (isNew ? 'New' : '')}</div>
          </div>
          <button class="add" data-toggle="${key.replace(/"/g,'&quot;')}">${inTxt}</button>
        </div>
      </div>`;
  };

  for(const it of its){
    const key=itemKey(it.category,it.name);
    if(!matches(it,key)) continue;

    shown++;
    const st0=(DATA.status?.[key] || 'available').toLowerCase();
    if(st0==='pending') pend++; else if(st0==='growing') grow++; else if(st0==='sold') sold++; else avail++;

    const isFeat=!!DATA.featured?.[key];
    const html = cardHtml(it);
    if(isFeat) featuredCards.push(html);
    else cards.push(html);
  }

  $('stats').innerHTML = `
    <div class="stat"><div class="k">Showing</div><div class="v">${shown}</div></div>
    <div class="stat"><div class="k">Available</div><div class="v">${avail}</div></div>
    <div class="stat"><div class="k">Pending</div><div class="v">${pend}</div></div>
    <div class="stat"><div class="k">Still Growing</div><div class="v">${grow}</div></div>
    <div class="stat"><div class="k">Sold</div><div class="v">${sold}</div></div>
    <div class="stat"><div class="k">Cart</div><div class="v">${Object.keys(cart).length}</div></div>
    <div class="stat"><div class="k">Text</div><div class="v">${PHONE_DISPLAY}</div></div>`;

  if(featuredCards.length && sortMode==='featured'){
    $('featuredSection').style.display='block';
    $('featuredGrid').innerHTML = featuredCards.join('');
    $('allTitle').style.display = cards.length ? 'block' : 'none';
  } else {
    $('featuredSection').style.display='none';
    $('allTitle').style.display = 'none';
    $('featuredGrid').innerHTML = '';
    cards.unshift(...featuredCards);
  }

  $('grid').innerHTML = cards.join('') || '<div class="card" style="grid-column:1/-1; color:rgba(255,255,255,.75);">No matching items.</div>';

  document.querySelectorAll('[data-toggle]').forEach(b=>{
    b.onclick = ()=>{
      const k=b.getAttribute('data-toggle');
      if(cart[k] != null) delete cart[k];
      else cart[k] = true;
      saveCart(); render();
    };
  });

  document.querySelectorAll('[data-addlb]').forEach(b=>{
    b.onclick = ()=>{
      const inc = parseFloat(b.getAttribute('data-addlb') || '1');
      const k = b.getAttribute('data-key');
      const cur = getQty(k) || 0;
      setQty(k, cur + inc);
      saveCart(); render();
    };
  });

  document.querySelectorAll('[data-open]').forEach(b=>{ b.onclick = ()=>openCartModal(); });

  document.querySelectorAll('.hero').forEach(div=>{
    div.onclick = ()=>{
      const url=div.getAttribute('data-img') || '';
      if(!url) return;
      showModal('Photo', `<img src="${url.replace(/"/g,'&quot;')}" style="width:100%; max-height:70vh; object-fit:contain; border-radius:16px;">`);
    };
  });

  if(typeof updateChipsActive==='function') updateChipsActive();
}

document.getElementById('openCart').onclick = openCartModal;
document.getElementById('fabOpen').onclick = openCartModal;
document.getElementById('fabCart').onclick = openCartModal;

document.getElementById('mc').onclick = hideModal;
document.getElementById('mok').onclick = hideModal;
document.getElementById('mb').onclick = (e)=>{ if(e.target===document.getElementById('mb')) hideModal(); };

['q','cat','st','fFeat','fNew','showSold','hideNoPrice','sort'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

/* --- Mobile storefront helpers (search + chips + background) --- */
function buildChips(){
  const host = document.getElementById('chips');
  if(!host) return;

  const make = (label, action, key)=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = label;
    if(key) b.dataset.key = key;
    b.onclick = ()=>{ action(); render(); };
    return b;
  };

  host.innerHTML = '';

  host.appendChild(make('All', ()=>{
    document.getElementById('cat').value = 'all';
    document.getElementById('fNew').checked = false;
  }, 'all'));

  host.appendChild(make('Priced', ()=>{ document.getElementById('hideNoPrice').checked = true; }, 'priced'));
  host.appendChild(make('WYSIWYG', ()=>{ document.getElementById('hideNoPrice').checked = false; }, 'wysiwyg'));
  host.appendChild(make('New', ()=>{ document.getElementById('fNew').checked = true; }, 'new'));

  const sel = document.getElementById('cat');
  Array.from(sel.options || []).forEach(opt=>{
    if(!opt || opt.value==='all') return;
    host.appendChild(make(opt.textContent, ()=>{ document.getElementById('cat').value = opt.value; }, 'cat:'+opt.value));
  });

  updateChipsActive();
}

function updateChipsActive(){
  const host = document.getElementById('chips');
  if(!host) return;

  const cat = document.getElementById('cat').value;
  const hideNoPrice = document.getElementById('hideNoPrice').checked;
  const onlyNew = document.getElementById('fNew').checked;

  host.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));

  const setActive = (key)=>{
    const el = host.querySelector(`.chip[data-key="${key}"]`);
    if(el) el.classList.add('active');
  };

  if(cat && cat !== 'all') setActive('cat:'+cat);
  else setActive('all');

  if(onlyNew) setActive('new');
  if(hideNoPrice) setActive('priced');
  else setActive('wysiwyg');
}

(function wireTopSearch(){
  const top = document.getElementById('qTop');
  const q = document.getElementById('q');
  if(!top || !q) return;

  top.value = q.value || '';

  const sync = (val)=>{
    q.value = val;
    top.value = val;
    render();
  };

  top.addEventListener('input', ()=>sync(top.value));
  q.addEventListener('input', ()=>{ if(top.value !== q.value) top.value = q.value; });

  top.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ sync(''); top.blur(); }
  });
})();

(function setBackground(){
  const url = (DATA && DATA.backgroundImageUrl) ? String(DATA.backgroundImageUrl).trim() : '';
  if(!url) return;
  document.documentElement.style.setProperty('--bg-url', `url("${url.replace(/"/g,'\"')}")`);
})();

setUpdated(); buildCategories(); buildChips(); saveCart(); render();
</script>
