<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brandon Miller's Coral Inventory</title>
<style>
:root{
  --bg1:#081a2a; --bg2:#063a38;
  --card: rgba(255,255,255,.06);
  --card2: rgba(255,255,255,.08);
  --stroke: rgba(255,255,255,.12);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.70);
  --good: rgba(140,255,190,.85);
  --warn: rgba(255,210,140,.85);
  --bad: rgba(255,130,130,.85);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--text);
  font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:
    radial-gradient(1200px 700px at 20% 20%, rgba(30,140,255,.22), transparent 60%),
    radial-gradient(900px 600px at 70% 30%, rgba(0,255,200,.18), transparent 65%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh;
}
.wrap{max-width:1200px; margin:0 auto; padding:28px 16px 40px;}
.top{display:flex; gap:14px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
h1{margin:0; font-size:40px; letter-spacing:.2px;}
.sub{margin-top:6px; color:var(--muted);}
.cta{display:flex; gap:10px; align-items:center;}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  padding:12px 16px; border-radius:16px;
  background: var(--card2); border:1px solid var(--stroke);
  color:var(--text); text-decoration:none; font-weight:900;
}
.notice{
  margin:16px 0; padding:14px 16px; border-radius:18px;
  background: rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  color:var(--muted);
}
.controls{
  display:grid; gap:12px;
  grid-template-columns: 1.4fr 1fr 1fr 1.2fr 1fr 1fr;
  margin-bottom:12px;
}
.card{
  background: var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:12px;
  backdrop-filter: blur(8px);
}
label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:900; letter-spacing:.2px;}
input,select{
  width:100%; padding:12px; border-radius:14px;
  background: rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.10);
  color:var(--text); outline:none;
}
.checks{display:flex; gap:12px; flex-wrap:wrap; align-items:center; padding-top:4px;}
.ck{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); font-weight:900;}
.stats{display:grid; gap:12px; grid-template-columns: repeat(7,1fr); margin:12px 0 16px;}
.stat .k{font-size:12px; color:var(--muted); font-weight:900;}
.stat .v{font-size:22px; font-weight:950; margin-top:4px;}
.grid{display:grid; gap:14px; grid-template-columns: repeat(auto-fill, minmax(260px,1fr));}
.item{
  background: rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  border-radius:22px;
  overflow:hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
  display:flex; flex-direction:column;
}
.hero{height:220px; background: rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.70); cursor:pointer;}
.hero img{width:100%; height:100%; object-fit:cover; display:block;}
.meta{padding:12px 12px 14px;}
.row1{display:flex; gap:10px; align-items:flex-start; justify-content:space-between;}
.name{font-weight:950; font-size:18px; line-height:1.2;}
.cat{font-size:12px; color:var(--muted); margin-top:3px; font-weight:900;}
.pill{
  font-size:12px; font-weight:950; padding:7px 10px; border-radius:999px;
  border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
  white-space:nowrap;
}
.p-available{color:var(--good)}
.p-pending{color:var(--warn)}
.p-growing{color:rgba(160,200,255,.90)}
.p-sold{color:var(--bad)}
.notes{margin-top:10px; color:rgba(255,255,255,.78); font-size:13px; white-space:pre-wrap; min-height:18px;}
.priceLine{margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.price{font-weight:950;}
.small{font-size:12px; color:var(--muted);}
.add{
  width:100%; margin-top:10px; padding:12px 14px;
  border-radius:14px; border:1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.18); color:var(--text); font-weight:950; cursor:pointer;
}
.add:hover{background: rgba(0,0,0,.24);}
/* Modal */
.modalBack{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,.52); padding:18px; z-index:50;}
.modal{width:min(900px,96vw); border-radius:22px; overflow:hidden; background: rgba(12,16,22,.92); border:1px solid rgba(255,255,255,.14);}
.mHead{padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; justify-content:space-between; gap:10px; align-items:center;}
.mTitle{font-weight:950; font-size:18px;}
.mBody{padding:14px 16px; color:rgba(255,255,255,.84);}
.mFoot{padding:12px 16px; border-top:1px solid rgba(255,255,255,.10); display:flex; justify-content:flex-end; gap:10px;}
.mBtn{padding:10px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color:var(--text); font-weight:950; cursor:pointer;}
@media (max-width:900px){
  h1{font-size:34px}
  .controls{grid-template-columns: 1fr 1fr;}
  .stats{grid-template-columns: repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Brandon Miller's Coral Inventory Page</h1>
      <div class="sub">CUSTOMER PAGE — browse corals and text to buy.</div>
    </div>
    <div class="cta">
      <a class="btn" id="callLink" href="#">Call</a>
      <a class="btn" id="textLink" href="#">Text to Buy</a>
    </div>
  </div>

  <div class="notice"><b>How to buy:</b> Add items to your Claim List, then tap <b>Text to Buy</b>.</div>

  <div class="controls">
    <div class="card">
      <label for="q">Search</label>
      <input id="q" type="text" placeholder="Search corals..."/>
    </div>
    <div class="card">
      <label for="cat">Category</label>
      <select id="cat"></select>
    </div>
    <div class="card">
      <label for="st">Status</label>
      <select id="st">
        <option value="all">All</option>
        <option value="available">Available</option>
        <option value="pending">Pending</option>
        <option value="growing">Still Growing</option>
        <option value="sold">Sold</option>
      </select>
    </div>
    <div class="card">
      <label>Filters</label>
      <div class="checks">
        <div class="ck"><input id="fFeat" type="checkbox"/> <span>Featured</span></div>
        <div class="ck"><input id="fNew" type="checkbox"/> <span>New</span></div>
        <div class="ck"><input id="hideSold" type="checkbox" checked/> <span>Hide sold</span></div>
      </div>
    </div>
    <div class="card">
      <label>Claim List</label>
      <a class="btn" href="javascript:void(0)" id="openClaim">Open</a>
      <div class="small" id="claimMini">0 items</div>
    </div>
    <div class="card">
      <label>Last updated</label>
      <div style="font-weight:900; margin-top:6px;" id="updatedAt"></div>
      <div class="small">Tap “Text to Buy” after selecting.</div>
    </div>
  </div>

  <div class="stats card" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="modalBack" id="mb">
  <div class="modal">
    <div class="mHead">
      <div class="mTitle" id="mt">Details</div>
      <button class="mBtn" id="mc">Close</button>
    </div>
    <div class="mBody" id="mcont"></div>
    <div class="mFoot">
      <button class="mBtn" id="mok">Close</button>
    </div>
  </div>
</div>

const PHONE_DIGITS = (DATA.phoneDigits||'').toString();
const PHONE_DISPLAY = (DATA.phoneDisplay||'').toString();
document.getElementById('callLink').setAttribute('href','tel:+' + PHONE_DIGITS);

const $ = (id)=>document.getElementById(id);
const norm=(s)=>(s||'').toString().trim().toLowerCase();
const itemKey=(c,n)=>c+'|'+n;
const currency=(n)=> new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const parsePrice=(s)=>{
  if(s==null) return NaN;
  const t=(''+s).replace(/[^0-9.]/g,'');
  if(!t) return NaN;
  return parseFloat(t);
};
const statusLabel=(s)=>{
  const v=(s||'available').toLowerCase();
  if(v==='pending') return ['Pending','p-pending'];
  if(v==='growing') return ['Still Growing','p-growing'];
  if(v==='sold') return ['Sold','p-sold'];
  return ['Available','p-available'];
};

const claimKey='coral_claim_list_v1';
const claim=JSON.parse(localStorage.getItem(claimKey)||'{}');

function saveClaim(){
  localStorage.setItem(claimKey, JSON.stringify(claim));
  const c=Object.keys(claim).length;
  $('claimMini').textContent = c + (c===1?' item':' items');
  $('openClaim').textContent = 'Open ('+c+')';
}
function setUpdated(){
  const d = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
  $('updatedAt').textContent = d && !isNaN(d) ? d.toLocaleString() : (DATA.updatedAt||'');
}
function buildCategories(){
  const set={};
  (DATA.items||[]).forEach(x=>set[x.category]=true);
  const cats=Object.keys(set).sort((a,b)=>a.localeCompare(b));
  $('cat').innerHTML = '<option value="all">All categories</option>' + cats.map(c=>`<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join('');
}
function showModal(title, html){
  $('mt').textContent=title;
  $('mcont').innerHTML=html;
  $('mb').style.display='flex';
}
function hideModal(){ $('mb').style.display='none'; }

function buildSmsHref(msg){
  return 'sms:' + PHONE_DIGITS + '?&body=' + encodeURIComponent(msg);
}
function textToBuy(){
  const keys=Object.keys(claim);
  if(!keys.length) return;
  const parts = keys.map(k=>{
    const [c,name]=k.split('|');
    const price=(DATA.pricesPlain && DATA.pricesPlain[k]) ? (''+DATA.pricesPlain[k]) : '';
    const pretty = (price && /[0-9]/.test(price) && isFinite(parsePrice(price))) ? currency(parsePrice(price)) : price;
    return `${name} (${c})${pretty ? ' — ' + pretty : ''}`;
  });
  const msg = 'Hi Brandon — I want to buy: ' + parts.join(', ') + '. Thanks!';
  window.location.href = buildSmsHref(msg);
}
document.getElementById('textLink').onclick = (e)=>{ e.preventDefault(); textToBuy(); };

function openClaimModal(){
  const keys=Object.keys(claim);
  if(!keys.length){ showModal('Claim List','<div>No items yet.</div>'); return; }
  let total=0;
  let rows='';
  keys.forEach(k=>{
    const [c,name]=k.split('|');
    const price=(DATA.pricesPlain && DATA.pricesPlain[k]) ? (''+DATA.pricesPlain[k]) : '';
    let pretty=price;
    if(price && /[0-9]/.test(price) && isFinite(parsePrice(price))){
      const n=parsePrice(price); total+=n; pretty=currency(n);
    }
    rows += `<div style="display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.10);">
      <div><div style="font-weight:900;">${name}</div><div style="color:rgba(255,255,255,.70); font-size:12px;">${c}</div></div>
      <div style="text-align:right;"><div style="font-weight:900;">${pretty||'—'}</div>
      <button class="mBtn" data-rm="${k}">Remove</button></div></div>`;
  });
  rows += `<div style="display:flex; justify-content:space-between; padding-top:10px;">
    <div style="font-weight:900;">Total</div><div style="font-weight:900;">${currency(total)}</div></div>
    <div style="margin-top:12px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
      <button class="mBtn" id="clearAll">Clear all</button>
      <button class="mBtn" id="textNow">Text to Buy</button>
    </div>`;
  showModal('Claim List', rows);
  document.querySelectorAll('[data-rm]').forEach(b=>{
    b.onclick = ()=>{ delete claim[b.getAttribute('data-rm')]; saveClaim(); openClaimModal(); };
  });
  $('clearAll').onclick = ()=>{ Object.keys(claim).forEach(k=>delete claim[k]); saveClaim(); openClaimModal(); };
  $('textNow').onclick = ()=>{ textToBuy(); };
}

function render(){
  const q=norm($('q').value);
  const cat=$('cat').value;
  const stf=$('st').value;
  const onlyFeat=$('fFeat').checked;
  const onlyNew=$('fNew').checked;
  const hideSold=$('hideSold').checked;

  const its=(DATA.items||[]).slice();
  its.sort((a,b)=>{
    const ka=itemKey(a.category,a.name), kb=itemKey(b.category,b.name);
    const fa=!!DATA.featured?.[ka], fb=!!DATA.featured?.[kb];
    if(fa!==fb) return fa?-1:1;
    const na=!!DATA.newTag?.[ka], nb=!!DATA.newTag?.[kb];
    if(na!==nb) return na?-1:1;
    const ca=a.category.localeCompare(b.category); if(ca!==0) return ca;
    return a.name.localeCompare(b.name);
  });

  let shown=0, avail=0, pend=0, grow=0, sold=0;
  const cards=[];

  for(const it of its){
    const key=itemKey(it.category,it.name);
    const st0=(DATA.status?.[key] || 'available').toLowerCase();
    const isFeat=!!DATA.featured?.[key];
    const isNew=!!DATA.newTag?.[key];

    if(q && !(norm(it.name).includes(q) || norm(it.category).includes(q))) continue;
    if(cat!=='all' && it.category!==cat) continue;
    if(stf!=='all' && st0!==stf) continue;
    if(hideSold && st0==='sold') continue;
    if(onlyFeat && !isFeat) continue;
    if(onlyNew && !isNew) continue;

    shown++;
    if(st0==='pending') pend++; else if(st0==='growing') grow++; else if(st0==='sold') sold++; else avail++;

    const [label,cls]=statusLabel(st0);
    const url=(DATA.photoUrls?.[key] || '').trim();
    const notes=(DATA.notes?.[key] || '').trim();
    const priceRaw=(DATA.pricesPlain?.[key] || '').toString().trim();
    const price=(priceRaw && /[0-9]/.test(priceRaw) && isFinite(parsePrice(priceRaw))) ? currency(parsePrice(priceRaw)) : priceRaw;

    cards.push(`
      <div class="item">
        <div class="hero" data-img="${url.replace(/"/g,'&quot;')}" data-name="${it.name.replace(/"/g,'&quot;')}">
          ${url ? `<img src="${url.replace(/"/g,'&quot;')}" alt="photo">` : `<div>📷 No photo</div>`}
        </div>
        <div class="meta">
          <div class="row1">
            <div>
              <div class="name">${it.name}</div>
              <div class="cat">${it.category}</div>
            </div>
            <div class="pill ${cls}">${label}</div>
          </div>
          <div class="notes">${notes || ''}</div>
          <div class="priceLine">
            <div class="price">${price || '—'}</div>
            <div class="small">${isFeat ? 'Featured' : (isNew ? 'New' : '')}</div>
          </div>
          <button class="add" data-add="${key}">${claim[key] ? 'Added ✔' : 'Add to Claim List'}</button>
        </div>
      </div>`);
  }

  $('grid').innerHTML = cards.join('') || '<div class="card" style="grid-column:1/-1; color:rgba(255,255,255,.75);">No matching items.</div>';
  $('stats').innerHTML = `
    <div class="stat"><div class="k">Showing</div><div class="v">${shown}</div></div>
    <div class="stat"><div class="k">Available</div><div class="v">${avail}</div></div>
    <div class="stat"><div class="k">Pending</div><div class="v">${pend}</div></div>
    <div class="stat"><div class="k">Still Growing</div><div class="v">${grow}</div></div>
    <div class="stat"><div class="k">Sold</div><div class="v">${sold}</div></div>
    <div class="stat"><div class="k">Claim list</div><div class="v">${Object.keys(claim).length}</div></div>
    <div class="stat"><div class="k">Text</div><div class="v">${PHONE_DISPLAY}</div></div>`;

  document.querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = ()=>{
      const k=b.getAttribute('data-add');
      if(claim[k]) delete claim[k]; else claim[k]=true;
      saveClaim(); render();
    };
  });
  document.querySelectorAll('.hero').forEach(div=>{
    div.onclick = ()=>{
      const url=div.getAttribute('data-img') || '';
      if(!url) return;
      showModal('Photo', `<img src="${url.replace(/"/g,'&quot;')}" style="width:100%; max-height:70vh; object-fit:contain; border-radius:16px;">`);
    };
  });
}

document.getElementById('openClaim').onclick = openClaimModal;
document.getElementById('mc').onclick = hideModal;
document.getElementById('mok').onclick = hideModal;
document.getElementById('mb').onclick = (e)=>{ if(e.target===document.getElementById('mb')) hideModal(); };

['q','cat','st','fFeat','fNew','hideSold'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

setUpdated(); buildCategories(); saveClaim(); render();
</script>
</body></html>
